  critical_qualities:
  - maintainability
  - recoverability
  quality_attributes:
  - id: maintainability
    priority: high
    rationale: Changes must remain bounded to an accountable owner.
    target:
      architecture_boundary_tests: required
    evidence:
    - Repository architecture tests
    scenario:
      source: A maintainer changes one owned module.
      trigger: A feature or correction changes module behavior.
      environment: Normal development and CI.
      target: The owning module and its public boundary.
      response: The change remains bounded and violations fail deterministically.
      measure: Architecture boundary checks pass.
  - id: reliability.recoverability
    priority: high
    rationale: Critical work must reach an explicit terminal outcome.
    target:
      recovery_test: required
    evidence:
    - Critical-flow recovery tests
    scenario:
      source: An expected interruption occurs.
      trigger: A critical flow is interrupted after work begins.
      environment: Normal operation under a declared failure.
      target: The critical-flow state owner.
      response: The flow resumes, compensates, or terminates safely.
      measure: Recovery tests prove no duplicate irreversible effect.
  business_context:
    product_stage: mature
    team_count: 1
    ownership_model: Single maintainer (peishengqing) with AI pair-programming (WorkBuddy).
    operational_maturity: medium
    distributed_system_experience: limited
    on_call: false
    change_frequency: frequent
    regulatory_constraints:
    - 公司生产数据仅限内网使用，不得外发至未授权服务
    user_scale: 单座位桌面应用；服务云南达利 1101 食品/1102 饮料两厂 16 车间的材料审核作业
    throughput: 单用户交互式；无并发吞吐要求
    latency_targets: 分析/导出允许分钟级（net_offset.py P0-4 优化后实测 2.5x 加速）
    availability_target: 单机本地应用，无 SLA 要求；崩溃恢复靠 _recovery_needed.flag 与 .bak
    data_volume: 已实测 audit.db 11.6MB + WAL 4.2MB；deviation_history 4143 行、quarantine_records 1492 行、read_status 44234 行（2026-09-12~10-11）
    consistency: 单写者本地 SQLite，WAL 模式
    offline_requirement: full
    deployment_model: Windows 10 x64 单机桌面（PySide6），PyInstaller 打包 exe 分发（build_pyside6_exe.py）
    budget: unknown
    deadlines: Unknown; confirm before migration planning.
    required_stack:
    - Python 3.11
    - PySide6
    - pandas
    prohibited_services:
    - 禁止引入云端依赖（本产品为纯本地桌面应用）
    - 禁止新增第三方运行时依赖（维护者明确红线）
    migration_limits:
    - Preserve public and persisted contracts.
    - 冻结区零改动：analysis/analyzer.py 与 analysis/excel_builder/sheet2_alt.py
