summary:
  architecture: 单座位 Windows 桌面应用（PySide6 GUI + Python 分析器），服务生产偏差审核。分层为 config/（配置）→ core/（领域服务约 20 模块）+ domain/ + modules/audit/
    + storage/ + analysis/（冻结计算区 analyzer.py + excel_builder/sheet1-10 + net_offset.py）→ gui_pyside6/（5638 行 main_window.py
    + components/controllers/dialogs/viewmodels/ widgets/services/models/workers）。数据持久化到 ~/.zpp011_audit/audit.db（SQLite WAL）。
    长任务走 6 个纯 QThread worker；启动链 run_pyside6.py → main_window.py。 底层包对 GUI 零反向依赖（分层方向正确）；主要结构性风险集中在数据访问边界缺失、 业务键重复构造与主窗口 God
    Object。
  raw_findings: 7
  confirmed: 0
  rejected: 0
  needs_evidence: 0
