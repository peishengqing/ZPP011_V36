# ZPP011 系统配置
# 修改此文件后无需重启应用，配置加载器在首次调用时生效。

alert:
  # 偏差率绝对值超过此值触发预警
  threshold_percent: 10.0
  # 后台预警扫描间隔（秒）
  scan_interval_seconds: 60
  # 仅监控替代料物料（True=仅替代料，False=全部物料）
  only_alt_materials: true

ppt:
  # PPT 报告中定义预警的阈值
  alert_threshold_percent: 10.0

data:
  # SAP 导出原数据目录：文件夹监控、自动加载、"打开 Excel"默认指向这里。
  # 换机器/换盘只改这一行，无需动任何代码。改完在「工具 → 设置」面板点保存即时生效。
  dir: 'E:\ZPP011导出文件原数据'

analysis:
  # 保留扩展位
