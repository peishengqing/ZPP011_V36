[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=core --cov=analysis --cov=modules --cov=gui_pyside6 --cov=utils --cov=storage --cov-report=term-missing:skip-covered --cov-report=html --cov-fail-under=18
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
